<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORPAZ | מתכונים</title>
<meta name="theme-color" content="#C2762C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#21322F; --ink-soft:#5B6D66; --bg:#F6F1E2; --surface:#FFFFFF; --surface-2:#FBF6E9;
    --accent:#BE7128; --accent-ink:#FFFFFF; --accent-2:#5B7553; --line:#E3D6B8;
    --danger:#A6432F;
    --shadow:0 1px 2px rgba(33,50,47,.08),0 6px 18px rgba(33,50,47,.07);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1ECDD; --ink-soft:#B7C3BC; --bg:#141F1D; --surface:#1D2B27; --surface-2:#24322D;
      --accent:#E3A15A; --accent-ink:#1B1200; --accent-2:#8FAF83; --line:#33443E; --danger:#E38A78;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1ECDD; --ink-soft:#B7C3BC; --bg:#141F1D; --surface:#1D2B27; --surface-2:#24322D;
    --accent:#E3A15A; --accent-ink:#1B1200; --accent-2:#8FAF83; --line:#33443E; --danger:#E38A78;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Assistant',system-ui,Arial,sans-serif;
    min-height:100vh; overscroll-behavior-y:none;
  }
  h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',Georgia,serif; text-wrap:balance;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}

  .app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:18px 16px 12px; border-bottom:1px solid var(--line);
  }
  .titlebar{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .titlebar h1{font-size:1.5rem; margin:0; font-weight:700; color:var(--ink);}
  .titlebar .count{font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .search{position:relative;}
  .search input{
    width:100%; padding:11px 42px 11px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:1rem; font-family:inherit;
  }
  .search input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .search svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--ink-soft); pointer-events:none;}

  .chips{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:.85rem; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  main{flex:1; padding:14px 16px 40px;}
  .empty{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:.95rem;}
  .empty .serif{display:block; font-size:1.2rem; margin-bottom:6px; color:var(--ink);}

  .list{display:flex; flex-direction:column; gap:10px;}
  .card{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px; cursor:pointer; text-align:right; box-shadow:var(--shadow);
    position:relative;
  }
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .card .thumb{
    width:56px; height:56px; border-radius:11px; flex:0 0 auto; object-fit:cover; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; color:var(--accent); overflow:hidden;
  }
  .card .thumb svg{width:26px; height:26px;}
  .card .meta{flex:1; min-width:0;}
  .card h3{font-size:1.02rem; margin:0 0 3px; font-weight:700; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .sub{font-size:.78rem; color:var(--ink-soft); display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .card .sub .dom{font-weight:600;}
  .card .sub .dot{opacity:.5;}
  .tag-partial{background:var(--surface-2); color:var(--ink-soft); font-size:.7rem; padding:2px 7px; border-radius:999px; border:1px solid var(--line);}

  .fav-btn{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer;
  }
  .fav-btn svg{width:20px; height:20px; transition:transform .15s ease;}
  .fav-btn[aria-pressed="true"]{color:var(--accent);}
  .fav-btn[aria-pressed="true"] svg{transform:scale(1.12);}
  .fav-btn:active svg{transform:scale(.85);}

  /* Detail overlay */
  .overlay{
    position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .overlay.open{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ .overlay{transition:none;} }
  .detail-wrap{max-width:640px; margin:0 auto; padding-bottom:60px;}
  .detail-hero{
    height:220px; background:linear-gradient(160deg,var(--accent),var(--accent-2)); position:relative;
    display:flex; align-items:flex-end; overflow:hidden;
  }
  .detail-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .detail-hero .scrim{position:absolute; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 60%);}
  .detail-hero svg.big-icon{position:absolute; inset:0; margin:auto; width:64px; height:64px; color:rgba(255,255,255,.55);}
  .topbar{position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; padding:12px; pointer-events:none;}
  .topbar button{pointer-events:auto;}
  .round-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:rgba(20,25,23,.45); color:#fff;
    backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .round-btn svg{width:19px; height:19px;}
  .detail-title-block{padding:16px 18px 4px;}
  .detail-title-block h2{font-size:1.5rem; margin:0 0 6px; font-weight:700;}
  .detail-title-block .desc{color:var(--ink-soft); font-size:.92rem; line-height:1.5; margin:0 0 10px;}
  .meta-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .meta-pill{
    display:flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--line);
    padding:5px 11px; border-radius:999px; font-size:.78rem; color:var(--ink-soft);
  }
  .meta-pill svg{width:14px; height:14px;}

  .section{padding:18px; border-top:1px solid var(--line); margin-top:6px;}
  .section h3{font-size:1.1rem; margin:0 0 12px;}
  .ing-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
  .ing-list li{
    display:flex; align-items:flex-start; gap:10px; font-size:.95rem; line-height:1.45; cursor:pointer;
  }
  .ing-list .box{
    flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line); margin-top:2px;
    display:flex; align-items:center; justify-content:center; background:var(--surface);
  }
  .ing-list .box svg{width:13px; height:13px; opacity:0; color:var(--accent-ink);}
  .ing-list li.checked .box{background:var(--accent-2); border-color:var(--accent-2);}
  .ing-list li.checked .box svg{opacity:1;}
  .ing-list li.checked span.txt{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}

  .steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:16px; counter-reset:step;}
  .steps li{display:flex; gap:12px; font-size:.95rem; line-height:1.55; counter-increment:step;}
  .steps li::before{
    content:counter(step); flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--accent);
    color:var(--accent-ink); font-weight:700; font-size:.82rem; display:flex; align-items:center; justify-content:center;
    font-family:'Assistant',sans-serif; font-variant-numeric:tabular-nums;
  }
  .notes{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:13px 15px; font-size:.88rem; color:var(--ink-soft); line-height:1.55;}
  .source-link{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px;
    color:var(--ink-soft); text-decoration:none; font-size:.85rem; border-top:1px solid var(--line);
  }
  .source-link svg{width:15px; height:15px; flex:0 0 auto;}

  .fav-fab{
    position:fixed; bottom:0; inset-inline:0; max-width:640px; margin:0 auto; z-index:6;
  }

  .fab-add{
    position:fixed; bottom:22px; inset-inline-end:calc(22px + max(0px, (100vw - 640px)/2));
    z-index:15; width:56px; height:56px; border-radius:50%; border:none;
    background:var(--accent); color:var(--accent-ink); font-size:1.9rem; line-height:1;
    box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .fab-add:active{transform:scale(.94);}

  .tag-mine{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
    font-size:.7rem; padding:2px 8px; border-radius:999px;}

  .form-wrap{max-width:640px; margin:0 auto; padding-bottom:50px;}
  .form-wrap .topbar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:12px; pointer-events:auto;}
  .form-wrap .round-btn{background:var(--surface-2); color:var(--ink); position:static;}
  .form-title{font-size:1.1rem; font-weight:700;}
  .form-body{padding:18px; display:flex; flex-direction:column; gap:14px;}
  .form-body label{display:flex; flex-direction:column; gap:6px; font-size:.85rem; font-weight:600; color:var(--ink-soft);}
  .form-body input, .form-body textarea{
    font-family:inherit; font-size:1rem; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); resize:vertical;
  }
  .form-body input:focus, .form-body textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn-secondary{align-self:flex-start; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:.82rem; font-weight:600; cursor:pointer;}
  .form-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-primary{flex:1; padding:13px; border-radius:12px; border:none; background:var(--accent);
    color:var(--accent-ink); font-weight:700; font-size:1rem; cursor:pointer;}
  .btn-primary:disabled{opacity:.6;}
  .btn-danger{padding:13px 18px; border-radius:12px; border:1px solid var(--danger); background:transparent;
    color:var(--danger); font-weight:700; font-size:.95rem; cursor:pointer;}
  .form-hint{font-size:.78rem; color:var(--ink-soft); line-height:1.5; margin:0;}
  .form-error{font-size:.8rem; color:var(--danger); line-height:1.4; margin:-8px 0 0;}

  @media (min-width:520px){
    .card .thumb{width:64px; height:64px;}
  }
</style>
</head>
<body>


<div class="app">

    <div class="titlebar">
      <h1 class="serif">ORPAZ <span style="font-size:.55em; font-weight:600; color:var(--ink-soft);">מתכונים</span></h1>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="detail-wrap" id="detailWrap"></div>
</div>

    insBlock = afterIng;
  }
  const splitLines = s => s.split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
  return { ingredients: splitLines(ingBlock), instructions: splitLines(insBlock) };
}

function openForm(existing){
  const isEdit = !!existing;
  detailWrap.innerHTML = `
    <div class="form-wrap">
      <div class="topbar">
        <button class="round-btn" id="formClose" aria-label="סגירה">${ICONS.back}</button>
        <span class="form-title serif">${isEdit ? 'עריכת מתכון' : 'הוספת מתכון'}</span>
      </div>
      <div class="form-body">
        ${isEdit ? '' : `
        <label>הדבקה חכמה (לא חובה)
          <textarea id="fSmart" rows="4" placeholder="חשוב: כאן מדביקים את הטקסט של המתכון עצמו (המרכיבים וההוראות) - לא קישור! האתר לא יכול לצפות בסרטון או לקרוא פוסט בשבילכם. תעתיקו את הכיתוב מתחת לסרטון/פוסט, או פשוט תקלידו בעצמכם מה שראיתם, ותדביקו כאן."></textarea>
        </label>
        <p class="form-hint" id="smartHint" hidden></p>
        <button type="button" id="fSmartBtn" class="btn-secondary">פיצול אוטומטי לשדות</button>
        `}
        <label>כותרת *<input id="fTitle" value="${existing ? escAttr(existing.title) : ''}" required></label>
        <p class="form-error" id="titleError" hidden>צריך להזין כותרת למתכון כדי לשמור.</p>
        <label>קישור למקור (טיקטוק / פייסבוק / כל קישור - לא חובה)<input id="fUrl" type="url" value="${existing ? escAttr(existing.url==='#'?'':existing.url) : ''}" placeholder="https://..."></label>
        <label>קישור לתמונה (לא חובה)<input id="fImage" type="url" value="${existing && existing.image ? escAttr(existing.image) : ''}"></label>
        <label>מרכיבים - מרכיב אחד בכל שורה<textarea id="fIngredients" rows="6">${existing ? esc((existing.ingredients||[]).join('\n')) : ''}</textarea></label>
        <label>אופן ההכנה - שלב אחד בכל שורה<textarea id="fInstructions" rows="6">${existing ? esc((existing.instructions||[]).join('\n')) : ''}</textarea></label>
        <label>הערות (לא חובה)<textarea id="fNotes" rows="2">${existing ? esc(existing.notes||'') : ''}</textarea></label>
        <div class="form-actions">
          ${isEdit ? '<button type="button" id="fDelete" class="btn-danger">מחיקה</button>' : ''}
          <button type="button" id="fSave" class="btn-primary">שמירה</button>
        </div>
        <p class="form-hint">${artifactCap ? 'שינויים נשמרים ומופיעים בכל מכשיר שפותח את הקישור הזה.' : 'שמירה מקוונת לא זמינה כרגע - השינויים יישמרו רק על המכשיר הזה.'}</p>
      </div>
    </div>
  `;
  if(!isEdit){
    detailWrap.querySelector('#fSmartBtn').addEventListener('click', ()=>{
      const raw = detailWrap.querySelector('#fSmart').value;
      const hint = detailWrap.querySelector('#smartHint');
      const trimmed = raw.trim();
      if(/^https?:\/\/\S+$/i.test(trimmed)){
        hint.hidden = false;
        hint.textContent = 'זה נראה כמו קישור בלבד, לא טקסט מתכון - הדביקו אותו בשדה "קישור למקור" למטה, ותכתבו/תדביקו כאן את הטקסט של המרכיבים וההוראות עצמם.';
        const urlField = detailWrap.querySelector('#fUrl');
        if(!urlField.value) urlField.value = trimmed;
        return;
      }
      const res = smartSplit(raw);
      if(!res.ingredients && !res.instructions){
        hint.hidden = false;
        hint.textContent = 'לא הצלחנו לזהות מרכיבים/הוראות אוטומטית בטקסט הזה - אפשר למלא את השדות למטה ידנית.';
        return;
      }
      hint.hidden = true;
      if(res.ingredients) detailWrap.querySelector('#fIngredients').value = res.ingredients;
      if(res.instructions) detailWrap.querySelector('#fInstructions').value = res.instructions;
    });
  }
  detailWrap.querySelector('#formClose').addEventListener('click', closeDetail);
  detailWrap.querySelector('#fSave').addEventListener('click', async ()=>{
    const titleInput = detailWrap.querySelector('#fTitle');
    const title = titleInput.value.trim();
    const titleError = detailWrap.querySelector('#titleError');
    if(!title){ titleError.hidden = false; titleInput.focus(); return; }
    titleError.hidden = true;
    const url = detailWrap.querySelector('#fUrl').value.trim();
    const image = detailWrap.querySelector('#fImage').value.trim() || null;
    const ingredients = detailWrap.querySelector('#fIngredients').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const instructions = detailWrap.querySelector('#fInstructions').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const notes = detailWrap.querySelector('#fNotes').value.trim() || null;
    let domain = 'נוסף ידנית';
    if(url){ try{ domain = new URL(url).hostname.replace(/^www\./,''); }catch(e){} }
    const saveBtn = detailWrap.querySelector('#fSave');
    saveBtn.disabled = true; saveBtn.textContent = 'שומר…';
    if(isEdit){
      Object.assign(existing, {
        title, image, ingredients, instructions, notes,
        url: url || existing.url, source_domain: url ? domain : existing.source_domain
      });
    } else {
      RECIPES.push({
        id: 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        extraction_method: 'user-added',
        title, description: null, image, ingredients, instructions,
        prep_time: null, cook_time: null, total_time: null, yield: null, notes,
        url: url || '#', chat_lines: [], source_domain: domain
      });
    }
    await persist();
    filter = 'mine';
    document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.filter==='mine' ? 'true' : 'false'));
    closeDetail();
    render();
  });
  if(isEdit){
    detailWrap.querySelector('#fDelete').addEventListener('click', async ()=>{
      if(!confirm('למחוק את המתכון?')) return;
      const i = RECIPES.indexOf(existing);
      if(i>-1) RECIPES.splice(i,1);
      await persist();
      closeDetail();
      render();
    });
  }
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  history.pushState({detail:true}, '');
}

function closeDetail(){
  overlay.classList.remove('open');
  document.body.style.overflow='';
  if(history.state && history.state.detail) history.back();
}

window.addEventListener('popstate', ()=>{
  overlay.classList.remove('open');
  document.body.style.overflow='';
});

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    chip.setAttribute('aria-pressed','true');
    filter = chip.dataset.filter;
    render();
  });
});

qInput.addEventListener('input', ()=>{ query = qInput.value.trim(); render(); });

overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeDetail(); });

document.getElementById('addFab').addEventListener('click', ()=>openForm(null));

render();

(async function initCapability(){
  try{
    artifactCap = await claude.use('artifact');
  }catch(e){
    artifactCap = null;
  }
  if(!artifactCap){
    try{
      const local = JSON.parse(localStorage.getItem('userRecipes') || '[]');
      const existingIds = new Set(RECIPES.filter(r=>r.id).map(r=>r.id));
      local.forEach(r=>{ if(!existingIds.has(r.id)) RECIPES.push(r); });
      if(local.length) render();
    }catch(e){}
  }
})();
</script>

</body>
</html>
